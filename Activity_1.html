<!DOCTYPE html>

<html>


<body>

    <h1>JavaScript String Methods</h1>
    <p>Basic Methods</p>

    <script>
        var str = "AmAzInG"
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith('A'));

        document.write("<br>");

        var str = "I learnt about Methods";
        var patt = new RegExp("food");
        var res = patt.test(str);
        document.write(res);

    </script>



</body>

</html>
