<!DOCTYPE html>

<html>

<body>

    <h2>JavaScript For Loop</h2>

    <p id="demo"></p>

    <script>
        var person = {
            name: "Siarra",
            age: 14,
        }
        document.getElementById("demo").innerHTML = person.name + " is " + person["age"] + " years old."
    </script>

</body>

</html>
