<!DOCTYPE html>

<html>

<body>

    <h2>The JavaScript String() Method</h2>

    <p>The String() method can convert a number to a string.</p>

    <p id="number_result"></p>

    <p id="string_result"></p>

    <script>

        var num = 50
        var num2 = 10

        document.getElementById("number_result").innerHTML = num + num2

        document.getElementById("string_result").innerHTML = String(num) + String(num2)




    </script>

</body>

</html>
