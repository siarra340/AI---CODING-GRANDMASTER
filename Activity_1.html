<!DOCTYPE html>

<html>

<head>
    <style>
        div {
            position: static;
            border: 1px solid green
        }

        .sticky {
            position: sticky;
            top: 50px;
        }

        .relative {
            position: relative;
            left: 50px;
        }

        .absolute {
            position: absolute;
            right: 50px;
        }

        .fixed {
            position: fixed;
            top: 0px;
            right: 100px;
        }
    </style>
</head>

<body>

    <!-- change the position to show the diffference

static

relative

fixed

absolute

sticky-->

    <h2>POSITIONING</h2>

    <div>

        Div with no position property

    </div>

    <div class="sticky">

        Div with sticky position property

    </div>

    <div class="relative">

        This div element has position: relative;

        <div class="absolute">

            Absolute class DIV

        </div>

    </div>

    <div class="fixed">

        Div with fixed position property

    </div>
