<!DOCTYPE html>

<html>

<body>
    <h2>JavaScript Class Inheritance</h2>
    <p id="vechical"></p>

    <script>
        class Car {
            constructor(brand) {
                this.carname = brand;
            }
            present() {
                return "The car brand is " + this.carname;
            }
        }

        class model extends Car {
            constructor(brand, mod) {
                super(brand);
                this.model = mod;
            }
            show() {
                return this.present() + ', it is a ' + this.model;
            }
        }

        let myCar = new model("Audi", "Sedan");
        document.getElementById("vechical").innerHTML = myCar.show();
    </script>
</body>

</html>
