<!DOCTYPE html>

<html>

<body>
    <h2>JavaScript class</h2>

    <p id="student4"></p>

    <script>

        class Student {
            constructor(name, year) {
                this.name = name;
                this.year = year;
            }

            age() {
                let date = new Date();
                let age = date.getFullYear() - this.year
                return age

            }



        }

        const student4 = new Student("Anne", 2014)
        document.getElementById("student4").innerHTML = "The students name is " + student4.name + ". The student was born in " + student4.year + " and her age is " + student4.age();



    </script>
</body>

</html>
