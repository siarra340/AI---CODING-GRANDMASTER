<!DOCTYPE html>
<html>

<head>
    <title>Introduction to CSS</title>

    <style>
        h2 {
            color: brown
        }

        .para {
            color: green
        }

        #text {
            color: red;
            background-color: lightblue;
        }

        * {
            color: gold;
            background-color: orange;
        }

        h3,
        p,
        i {
            color: black
        }
    </style>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1 style="color:blue"> Inline CSS Element</h1>

    <h2>Internal CSS Element</h2>


    <p class="para">Changing Color with Class Selector</p>

    <b id="text"> This is an id selector</b>



    <h3>This is group selector</h3>
    <p>This is group selector</p>
    <i>This is group selector</i>

</body>


</html>
