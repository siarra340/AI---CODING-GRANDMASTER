<!DOCTYPE html>
<html lang="en">

<head>

    <title>Bank App</title>

</head>

<h1>Bank App</h1>



<label for="transaction">Enter Transaction Amount</label>
<input type="number" id="transaction" name="transaction" min="0" placeholder="0">

<br>

<button onclick="credit()">Credit</button>
<button onclick="debit()">Debit</button>

<p>Your Account Balance is : Rs. <span id="balance-amount">0</span> </p>

<script>

    let balance = 0

    function credit() {
        let amount = Number(document.getElementById('transaction').value);

        balance += amount;
        updateUI();
    }

    function debit() {
        let amount = Number(document.getElementById('transaction').value)
        balance -= amount;
        updateUI();
    }

    function updateUI() {
        document.getElementById('balance-amount').innerText = balance
        document.getElementById('transaction').value = ""
    }



</script>



</html>
