<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Copied the head -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <!-- My CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/61caf434c2.js" crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap"
        rel="stylesheet">


</head>

<body>

    <div id="social-media" class="container-fluid">

        <div class="container text-white py-5">

            <h4 class="text-info">Susan's Social Media</h4>
            <h2 class="heading">follow us to join our journy</h2>

            <div class="row pt-5">

                <div class="col-3 media_link btn" href="#">

                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">Instagram</h3>

                        </div>

                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fa-brands fa-square-instagram"></i>

                        </div>

                    </div>

                </div>

                <div class="col-3 media_link btn">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">X </h3>

                        </div>

                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fa-brands fa-square-x-twitter"></i>

                        </div>


                    </div>


                </div>

                <div class="col-3 media_link bg-info btn email">
                    <div class="row">

                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-dark">Email</h3>

                        </div>

                        <div class="col-6 d-flex justify-content-end align-items-center">

                            <i class="fa-solid fa-envelope"></i>


                        </div>

                    </div>

                </div>

            </div>


        </div>


    </div>

    <footer>

        <div class="container text-muted text-center py-3 ">

            <h5>
                Copyright &copy; 2022 |
                <a class="text-warning text-decoration-none" href="#about">All Rights Are Reserved By Susan's
                    Restruant</a>

            </h5>

        </div>

    </footer>


</body>



</html>
