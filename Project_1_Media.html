<!DOCTYPE html>
<html>

<head>
    <title>Media in HTML</title>
</head>

<body>
    <h1> About cats</h1>
    <i>This is a cat image</i>
    <br> <img src="cat.avif" alt="Cat image" style="width:200px;height:300px;">

    <br> <i>These is an audio of a cat</i>
    <audio controls autoplay>
        <source src="Cat.mp3" type="audio/mpeg">
        Your Broswer does not support this audio
    </audio>
    <br><i>Video of a cat</i>
    <br><video width="200" height="300" controls>
        <source src="Cat.mp4" type="video/mp4">
        Your browser does not support this video
    </video>
    <br> <i> A cat youtube video</i>

    <br><iframe width="400" height="300" src="https://www.youtube.com/embed/rqXlYY88t6w?si=ZxDRjVkq14BfthzO">

    </iframe>

</body>

</html>
