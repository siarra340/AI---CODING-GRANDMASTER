<!DOCTYPE html>

<html>

<head>
    <title>Event Registration Form</title>

    <style>
        body {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif background-color: #f4f7ff;
            color: #222222;
            text-align: center;
        }

        .form-card {
            width: 520px;
            background-color: white;
            border: 3px solid #3b82f6;
            border-radius: 18px;
            margin: 40px auto;
            padding: 25px;
            box-shadow: 0 0 18px #93c5fd;
        }



        h1 {
            color: #1d4ed8;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-top: 12px;
        }

        input,
        select {

            width: 95%;
            padding: 10px;
            margin-top: 6px;
            border: 2px soild #93c5fd;
            border-radius: 8px;
            font-size: 15px;

        }

        button {
            padding: 12px 28px;
            margin-top: 20px;
            border-radius: 10px;
            font-size: 14px;
            border: 2px solid rgb(231, 218, 205);
            background-color: lightblue;
            /* I added a sword cursor */
            cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M2%202l12%2012-3%203-12-12z%22%20fill%3D%22%231d4ed8%22/%3E%3Cpath%20d%3D%22M12%2012l2-2%204%204-2%202z%22%20fill%3D%22%2393c5fd%22/%3E%3Cpath%20d%3D%22M16%2016l6%206-2%202-6-6z%22%20fill%3D%22%23222222%22/%3E%3C/svg%3E") 2 2, pointer;

        }

        button:hover {
            background-color: rgb(27, 135, 202);
        }

        #feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            line-height: 1.6;
        }

        .success {
            background-color: #dcfce7;
            color: #166534;
            border: 2px solid #22c553;
        }

        .error {
            background-color: #f7cec4;
            color: rgb(248, 70, 70);
            border: 2px dotted rgb(227, 91, 91)
        }
    </style>

</head>

<body>

    <div class="form-card">

        <h1>Event Registration Form</h1>
        <p>Fill in the form to register for the school event and generate your event pass.</p>

        <form id="eventForm">

            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" required minlength="3" placeholder="Enter your name">

            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="Enter your email">

            <label for="age">Age</label>
            <input type="number" id="age" required min="8" max="18" placeholder="Enter your age">

            <label for="eventName">Choose Event</label>

            <select id="eventName" required>

                <option value="">Select an Event</option>
                <option value="Science Fair">Science Fair</option>
                <option value="Coding Comptition">Coding Comptition</option>
                <option value="Art Comptition">Art Comptition</option>
                <option value="Sports Day">Sports Day</option>

            </select>

            <button type="button" onclick="registerEvent()">Register Event Now</button>

        </form>

        <div id="feedback">
            Waiting for registration...
        </div>

    </div>

    <script>

        function registerEvent() {

            let form = document.getElementById("eventForm");
            let feedback = document.getElementById("feedback");


            try {
                if (!form.checkValidity()) {
                    form.reportValidity();
                    throw "Please fill out all required feilds correctly";

                }


                let studentName = document.getElementById("studentName").value;
                let email = document.getElementById("email").value;
                let age = Number(document.getElementById("age").value);
                let eventName = document.getElementById("eventName").value;


                if (studentName.length < 3) {
                    throw "Name must have at least 3 charcaters.";
                }

                if (age < 8 || age > 18) {
                    throw "Age must be between 8 and 18.";
                }

                if (eventName === "") {
                    throw "Please select an event.";
                }

                feedback.className = "";
                feedback.innerHTML = "Checking your registration details...";

                setTimeout(function () {

                    let passNumber = Math.floor(Math.random() * 9000) + 1000;

                    feedback.className = "success";
                    feedback.innerHTML =
                        "Resgistration Successful! <br>" +
                        "Student Name: " + studentName +
                        "<br>" +
                        "Email: " + email + "<br>" +
                        "Age: " + age + "<br>" +
                        "Event: " + eventName + "<br>" +
                        "Your Event Pass Number: EVT-" + passNumber;

                }, 2000);

            }

            catch (error) {
                feedback.className = "error";

                if (error !== undefined) {
                    feedback.innerHTML = "Registration failed: " + error;
                } else {
                    feedback.innerHTML = "Please complete all the requried feilds correctly.";
                }
            }

        }




    </script>

</body>

</html>
