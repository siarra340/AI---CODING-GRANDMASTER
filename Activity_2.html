<!DOCTYPE html>

<html>

<body>

    <h1>Variables in JavaScript</h1>
    <p>The sum of two Numbers</p>
    <p id="result"></p>

    <script>
        var num1 = 7;
        var num2 = 3;
        var sum = num1 + num2;
        document.getElementById("result").innerHTML = "The total sum is:" + sum;
    </script>

</body>

</html>
