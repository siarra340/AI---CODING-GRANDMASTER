<!DOCTYPE html>
<html>

<head>
    <title>Forms in HTML</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Personal Information Form</legend>
            <label>Name:</label>
            <br>
            <input type="text" id="name">
            <br>
            <label>Email:</label>
            <br><input type="text" id="email">
            <br>
            <label>Password:</label>
            <br><input type="password">
            <br><br><label>Gender</label>
            <br><input type="radio" id="male" value="male">Male
            <br><input type="radio" id="female">Female
            <br><br><label>Date of Birth:</label>
            <br><input type="date" id="birthday">
        </fieldset>
    </form>


</body>

</html>
