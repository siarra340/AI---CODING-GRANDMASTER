<!DOCTYPE html>

<html>

<body>

    <h1>JavaScript Array Methods</h1>
    <h2>join() and pop() </h2>
    <p>The join() is used to join the array elements into a string and pop() removes the last array element.</p>

    <p id="myjoin"></p>
    <p id="mypop1"></p>
    <p id="mypop2"></p>

    <script>
        var fruits = [" Grapes", " Orange", " Apple", " Stawberry", " Pineapple"];
        document.getElementById("myjoin").innerHTML = fruits.join(",")
        document.getElementById("mypop1").innerHTML =
            fruits;
        fruits.pop();
        document.getElementById("mypop2").innerHTML =
            fruits;

    </script>




</body>
