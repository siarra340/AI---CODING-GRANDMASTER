<!DOCTYPE html>

<html>

<body>

    <h2>JavaScript Error Handeling</h2>

    <p>The example shows how to use <b>catch</b> to display an error</p>

    <p id="error_message"></p>

    <script>
        try {
            addalert("Welcome geust!");
        }

        catch (err) {
            document.getElementById("error_message").innerHTML = err.message;
        }
    </script>

</body>

</html>
