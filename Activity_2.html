<!DOCTYPE html>

<html>

<body>

    <h2>JavaScript For Loop</h2>

    <p id="demo"></p>

    <script>

        var food = ["Pizza", "Burger", "Noodles", "Ice cream", "Fried Rice"];
        var text = "";
        var i;
        for (i = 0; i < food.length; i++) { text += food[i] + "</br>" }
        document.getElementById("demo").innerHTML = text
    </script>


</body>

</html>
