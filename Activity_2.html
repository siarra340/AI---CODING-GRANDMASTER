<!DOCTYPE html>

<html>

<head>
    <style>
        div {
            background-color: rgb(66, 153, 210);
            padding: 10px;
        }

        div.one {
            opacity: 0.1;
        }

        div.two {
            opacity: 0.5;
        }

        div.three {
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <h1>Opacity Property Example</h1>
    <div class="one">
        <p>Opacity 0.1</p>
    </div>
    <div class="two">
        <p>Opacity 0.5</p>
    </div>
    <div class="three">
        <p>Opacity 0.7</p>
    </div>

    <div class="four">
        <p>Opacity 1 (default)</p>
    </div>

</body>

</html>
