<!DOCTYPE html>

<html>

<head>

</head>

<body>
    <p>Functions can access other functions which are defined within the variable. </p>
    <button type="button" onclick="myFunction()">Click this Button</button>

    <p id="demo1"></p>
    <p id="demo2"></p>

    <script>

        var b = 9;
        function myFunction() {
            var a = 2;
            document.getElementById("demo1").innerHTML = a * b;
        }
        document.getElementById("demo2").innerHTML = b
        document.getElementById("demo1").innerHTML = a


    </script>



</body>

</html>
