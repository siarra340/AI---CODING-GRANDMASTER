<!DOCTYPE html>

<html>

<head>


    <style>
        * {
            text-align: center;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        #text {
            text-shadow: 2px 2px 1px rgb(89, 193, 241);

        }

        #box {
            box-shadow: 9px 9px 5px rgb(228, 29, 29)
        }

        #indent {
            text-indent: 50%;
        }
    </style>

</head>



<body>
    <h1 id="text">Text-shadow is used to give a text itself a shadow</h1>
    <h1 id="box">Or use box shadow to give a shadow to the element</h1>

    <div>
        <p>This is an example of text-indent</p>
        <p id="indent">This is an example of text-indent</p>
    </div>

</body>

</html>
