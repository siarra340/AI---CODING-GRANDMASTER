   b) Add an empty paragraph `<p id="result"></p>` to display the output.

4) Create a function named `findMax()`:
   a) This function will find the largest value from the `arguments` object.

   a) Create a variable `i` for looping.
   b) Create a variable `max` and set it to 0 (starting maximum).

   a) Start from `i = 0`
   b) Run while `i < arguments.length`
   c) Increase `i` by 1 each time

7) Inside the loop:
   a) If `arguments[i] > max`, update `max` to that value.

8) After the loop ends:
   a) Return `max`.

   b) Call `findMax(4, 5, 6)` and show the returned value.

<!DOCTYPE html>

<html>

<body>

    <p>Finding the largest number with the use of Arugment Objects.</p>
    <p id="result"></p>

    <script>
        function findmax() {
            var i;
            var max = 0;
            for (i = 0; i < arguments.length; i++) {
                if (arguments[i] > max) {
                    max = arguments[i];
                }
            }

            return max;


        }

        document.getElementById("result").innerHTML = findmax(5, 6, 7);
    </script>

</body>

</html>
