<!DOCTYPE html>
<html>

<body>
    <p>Click the button to evaluate the JS expressions.</p>
    <button onclick="myFunction()">Try it</button>

    <p id="result"></p>

    <script>
        function myFunction() {
            var x = 10;
            var y = 20;


            var a = eval("x+y") + "<br>";
            var b = eval("2*5") + "<br>";
            var c = eval("y*x") + "<br>";

            var res = a + b + c;
            document.getElementById("result").innerHTML = res;

        }

    </script>
</body>

</html>
