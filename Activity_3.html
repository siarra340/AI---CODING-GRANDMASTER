<!DOCTYPE html>

<html>

<head>
    <style>
        @keyframes example {
            0% {
                background-color: rgb(150, 150, 241);
            }

            25% {
                background-color: rgb(168, 243, 162);
            }

            50% {
                background-color: rgb(130, 187, 240);
            }

            100% {
                background-color: rgb(248, 246, 132);
            }


        }

        div {
            width: 200px;
            height: 200px;
            background-color: blueviolet;
            animation-name: example;
            animation-duration: 10s;

        }
    </style>

</head>

<body>

    <div>Hello</div>

</body>

</html>
