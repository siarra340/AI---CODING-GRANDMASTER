<!DOCTYPE html>

<html>

<body>

    <h2>JavaScript Functions: Old vs New</h2>

    <p>Traditional Function Result: <span id="old"></span></p>




    <p>Arrow Function Result: <span id="new"></span></p>

    <script>

        function old(a, b) {
            return a + b
        }

        document.getElementById("old").innerHTML = old(5, 7)

        newAdd = (a, b) => a + b
        document.getElementById("new").innerHTML = newAdd(7, 8)






    </script>

</body>

</html>
