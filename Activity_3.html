<!DOCTYPE html>

<html>


<body>

    <h1>Switches in JavaScript</h1>

    <p id="demo"></p>

    <script>
        var day;
        switch (new Date().getDay()) {
            case 0:
                day = "sunday"; break;
            case 1:
                day = "monday"; break;
            case 2:
                day = "tuesday"; break;
            case 3:
                day = "wenesday"; break;
            case 4:
                day = "thursday"; break;
            case 5:
                day = "Friday"; break;
            case 6:
                day = "saturday"; break;
        }
        document.getElementById("demo").innerHTML = "Today is " + day;
    </script>




</body>

</html>
