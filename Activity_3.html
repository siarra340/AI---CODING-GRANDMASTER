<!--
1) Start with `<!DOCTYPE html>` and open `<html>`.

2) In `<head>`, set the title: `<title>Function Declaration</title>`.

3) In `<body>`, use `<center>` to center the content.

4) Add headings:
   a) `<h1 style="color:green">Codingal Education</h1>`
   b) `<h3>Function Declaration</h3>`

5) In a `<script>` tag:
   a) Store a function in `result` that returns `a * b`.
   b) Print `result(5, 8)` using `document.write()`.

6) Close all tags: `</script>`, `</center>`, `</body>`, `</html>`.
-->

<!DOCTYPE html>

<html>

<head>
    <title>Function Decleration</title>
</head>

<body>

    <center>

        <h1 style="color:orange; font-family:Verdana, Geneva, Tahoma, sans-serif;">Codingal Education</h1>
        <h2>Function Decleration</h2>
        <script>
            var result = function (a, b) { return a * b };
            document.write(result(4, 2));
        </script>

    </center>



</body>

</html>
