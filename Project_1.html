<!DOCTYPE html>

<html>

<head>
    <style>
        div.static {

            border: 2px solid orange
        }

        div.absolute {
            position: absolute;
            left: 30px;
            border: 2px solid rgba(168, 244, 127, 0.679);

        }

        div.relative {
            position: relative;
            left: 50px;
            border: 2px solid orange;
        }

        div.fixed {
            position: fixed;
            down: 50px;
            right: 30px;
            width: 200px;
            border: 2px solid orange
        }

        div.sticky {
            position: sticky;
            top: 2px;
            left: 30px;
            width: 200px;
            border: 2px solid orange;
        }

        div.one {
            opacity: 0.1;
            background-color: orange;
        }

        div.two {
            opacity: 0.6;
            background-color: orange;
        }

        div.three {
            background-color: orange;
        }
    </style>
</head>

<body>

    <h1>Positioning</h1>
    <div class="static">Static div with no postion property</div>

    <div class="sticky">This is a div with a sticky property
    </div>

    <div class="relative">
        This div used the property relative
    </div>

    <div class="absolute">
        This div uses the absolute element
    </div>

    <div class="fixed">
        This div uses the fixed property
    </div>
    <br><br><br>
    <h1>Opacity Property</h1>

    <div class="one">Opacity 0.1</div>
    <div class="two">Opacity 0.6</div>
    <div class="three">Default opacity (1)</div>

    <br><br><br><br>
    <br><br><br><br>
    <br><br><br><br>
    <br><br><br><br>
    <br><br><br><br>
    <br><br><br><br>
    <br><br><br><br>
    <br><br><br><br>
    <br><br><br><br>
    <br><br><br><br>



</body>

</html>
