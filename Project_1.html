<!DOCTYPE html>
<hmtl>

    <head>
        <title>Introduction to CSS</title>

        <style>
            p {
                color: rgb(207, 108, 28)
            }

            #text {
                color: rgb(255, 226, 95);
                background-color: rgb(247, 166, 4)
            }

            .font {
                color: rgb(58, 145, 3)
            }

            * {
                color: rgb(156, 102, 232);
                background-color: rgb(147, 182, 227)
            }

            h5,
            em,
            b {
                color: rgb(132, 20, 6)
            }
        </style>

        <link rel="CSS" href="Index.CSS">

    </head>

    <h2 style="color:rgb(0, 118, 164); font-size:30px">This is how to do incline CSS </h2>

    <p>This how to do internal CSS</p>

    <i id="text">This is ID selector</i>

    <br><br> <b class="font">This is class selector</b>

    <br><br>
    <h6>This is universal selector</h6>

    <h5>This is a group selector</h5>
    <em>This is a group selector</em>
    <br><br><b>This is a group selector</b>



</hmtl>
