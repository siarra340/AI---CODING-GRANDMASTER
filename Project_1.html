<head>


    <style>
        #text1 {
            color: blue;

        .p1 {
            color: blueviolet;

            width: 200px;

            background-color: yellow;

        .decoration {
            color: rgb(49, 49, 225);
            text-decoration: underline;
            text-transform: uppercase;

        }

        h2 {
            text-decoration: underline overline;
            text-transform: lowercase;
        }

        #shadow {
            text-shadow: 3px 3px 5px rgb(49, 221, 49);

        }

            text-indent: 25%
        }

</head>
