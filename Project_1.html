<!DOCTYPE html>
<html>

<head>

    <title>My Daily Task Organizer</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background: lavender;
        }

        h1,
        h3 {
            color: darkviolet;
        }

        .box {
            background: white;
            color: darkviolet;
        }
    </style>


</head>

<body>

    <div class="container py-4">

        <h1 class="mb-1">My Daily Task Organizer</h1>

        <p class="text-muted mb-4">Sort and label your daily tasks using JavaScript array methods!</p>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Daily Tasks</h3>

                <button class="btn btn-warning mr-2" onclick="sortAZ()">Sort A to Z</button>
                <button class="btn btn-warning" onclick=" sortZA()">Sort Z to A </button>
                <div id="taskResult" class="box p-3 mt-3 rounded"></div>

            </div>

        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Task Time Needed</h3>
                <button class="btn btn-warning mr-2" onclick="sortShortest()">Shortest First</button>
                <button class="btn btn-warning" onclick="sortLongest()">Longest First</button>
                <div id="timeResult" class="box p-3 mt-3 rounded"></div>
            </div>

        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Label Every Task Time</h3>
                <button class="btn btn-warning" onclick="addLabel()">Add Minutes Label</button>

                <div id="labelResult" class="box p-3 mt-3 rounded"></div>

            </div>

        </div>


    </div>

    <script src="script.js"></script>

</body>


</html>
