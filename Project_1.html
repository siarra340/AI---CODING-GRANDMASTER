<!DOCTYPE html>
<html>

<head>
    <title>Box Model</title>

    <style>
        .example {
            width: 200px;
            background-color: rgb(113, 216, 113);
            padding: 20px;
            border: 2px solid rgb(231, 231, 57);
            margin: 15px
        }

        .box {
            width: 300px;
            background-color: rgb(93, 157, 221);
            padding: 50px;
            border: 5px solid purple;
        }

        hr {
            background: rgb(241, 133, 66);
        }

        img#flower1 {
            float: right
        }

        img#flower2 {
            float: left
        }
    </style>


</head>

<body>
    <h1>Box Model and Float</h1>
    <p class="example">The box model can be used to add padding, borders and margins to a text.</p>
    <hr style="width:15%; height:20px; color: orange;">

    <p class="box">The box model can be useful in styling an organizing a website</p>
    <hr style="width:50%;height:5px; color:orange">

    <p>

        <img id="flower1" src="float.png" alt="flower" style="width:100px;height:200;">
        <img id="flower2" src="float.png" alt="flower" style="width:100px; height:100px">

        This is an example of how it will look like when you float an image
    </p>



</body>



</html>
