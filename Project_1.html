<!DOCTYPE html>

<html>

<head>
    <title>Functions in JS</title>
</head>

<body>



    <button type="button" onclick="mult7(7)">Execute JS Function </button>
    <p id="mult"></p>

    <script>
        function mult7(x, y) {
            if (y === undefined) {
                y = 3
            }
            document.getElementById('mult').innerHTML = x * y
        }

    </script>

    <p style="color:rgb(76, 132, 193)">Varible Scope can be seprated into Global and Local</p>

    <button type="button" onclick="myFunction()">Click the Button to Double 8 </button>
    <p id="demo1"></p>
    <p id="demo2"></p>

    <script>
        var a = 8;

        function myFunction() {

            var b = 2;
            document.getElementById('demo1').innerHTML = a * b;

        }

        document.getElementById('demo1').innerHTML = a
        document.getElementById('demo2').innerHTML = b
    </script>

    <center>

        <h1 style="color:orange">Function Declaration</h1>


        <script>
            var answer = function (a, b) { return a * b };
            document.write(answer(10, 2))

        </script>

    </center>






</body>

</html>
