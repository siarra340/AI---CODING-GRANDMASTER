<!DOCTYPE html>

<html>

<body>

    <h1>JavaScript Simple Calculations</h1>
    <p>10÷5</p>
    <p id="result"></p>

    <p>8-6=</p>

    <p id="demo"></p>

    <p>3*16=</p>
    <p id="multiply"></p>

    <script>
        //division using JavaScript
        var num1 = 10;
        var num2 = 5;
        var sum = num1 / num2;
        document.getElementById("result").innerHTML = "The result of this calculation: " + sum;
    </script>

    <script>
        //Statement
        var a, b, c;
        a = 8;
        b = 2;
        c = a - b;
        document.getElementById("demo").innerHTML = "The value after subtraciting is: " + c
    </script>

    <script>
        var x = 6;
        var y = 3;
        var z = x * y;
        document.getElementById("multiply").innerHTML = "This is the product of after multipying: " + z
    </script>



</body>

</html>
