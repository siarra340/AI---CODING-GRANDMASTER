<!DOCTYPE html>
<html>

<title>School Event Data Viewer</title>

<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #e1eafb;
        color: black;
        text-align: center;
    }

    .event-card {
        width: 520px;
        background-color: white;
        border: 2px solid #3b82f6;
        margin: 40px auto;
        padding: 20px;
        box-shadow: 0 0 18px #93c5fd;
    }

    h1 {
        color: #1d4ed8;
    }

    button {
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 25px;
        padding: 12px 24px;
        font-size: 15px;
        cursor: pointer;
        font-weight: bold;

    }

    button:hover {
        background-color: #1e40af;
    }

    .info-box {
        background-color: #eff6ff;
        border: 2px dashed #60a5fa;
        border-radius: 12px;
        padding: 15px;
        text-align: left;
        line-height: 1.7;
        margin-top: 18px;

    }

    #status {
        color: #16a34a;
        font-weight: bold;
        font-size: 16px;
    }

    #jsonOutput {
        color: #9d4edd;
        word-wrap: break-word;
        font-size: 14px;


    }
</style>

<body>

    <div class="event-card">

        <h1>School Event Data Viewer</h1>

        <p>Click the button to get the school event data using JSON and asynchronous JavaScript. </p>

        <button onclick="showSchoolEvent()">Load Event Information</button>

        <div class="info-box">
            <h2>Loading Status</h2>
            <p id="status">Waiting to load event data....</p>
        </div>

        <div class="info-box">
            <h2>Event Details</h2>
            <p id="eventDetails"></p>
        </div>

        <div class="info-box">
            <h2>JSON Text Output</h2>
            <p id="jsonOutput"></p>
        </div>

        <script src="script1.js"></script>

</body>

</html>
