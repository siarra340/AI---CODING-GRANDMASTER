<!DOCTYPE html>

<html>

<head>

    <link href="styles.css" rel="stylesheet" type="text/css" />

    <style>
        input[type="email"] {
            border: 3px solid green;

        }

        input[type="password"] {
            border: 3px solid blue;
        }

        ul>li {
            color: rgb(86, 50, 9);
        }

        h1+p::before {
            content: "💻"
        }

        h1+p {
            color: brown
        }

        a:hover {
            color: rgb(255, 191, 127);
        }

        li:nth-child(2) {
            text-decoration: underline;
            background-color: rgb(249, 225, 225);
        }

        i:not(.class1) {
            border: 3px red dashed;
        }

        h1::first-letter {
            font-size: 80px;
            color: rgb(240, 149, 58)
        }
    </style>

</head>



<body>

    <h1>This is Advanced Selectors</h1>
    <p>These selectors can be used to change color, add text decoraction, and etc.</p>
    <a href="#">Hover over this</a>


    <br><br><input type="email" placeholder="Email"> <br><br><input type="password" placeholder="Password">
    <ul>
        <li>Apples</li>
        <li>Grapes</li>
        <li>Bannana</li>
    </ul>

    <i class="class1">Div 1</i>
    <br><i class="class2">Div 2</i>

</body>

</html>
