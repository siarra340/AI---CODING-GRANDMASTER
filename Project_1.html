<!DOCTYPE html>

<html>

<head>


    <title>Bootstrap</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        .col {
            text-align: center;
            border: 2px solid rgb(79, 85, 204);
            background-color: bisque;
        }
    </style>

</head>


<body>

    <div class="container">

        <h1>This is Unequal Grids using Bootstrap</h1>
        <p>Resize the browser window to see the different effects</p>

        <div class="row">

            <div class="col-md-2 col-xs-10"
                style="background-color:rgb(53, 145, 57); border:2px solid rgb(249, 249, 135)">xs

            </div>

            <div class="container">

                <h1>Equal width columns</h1>

                <div class="row">

                    <div class="col">column 1</div>
                    <div class="col">column 2</div>
                    <div class="col">column 3</div>
                </div>
            </div>


            <div class="container-fluid"></div>
            <h1>This is a large Grid</h1>

            <div class="row">
                <div class="col-lg-6" style="background-color: blueviolet;">Dummy
                </div>





            </div>

</body>

</html>
