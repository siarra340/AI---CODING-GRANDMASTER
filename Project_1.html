    <h2>Looping in JS</h2>
    <p id="demo"></p>
    <script>

        var veg = ["tomato", "cucumber", "carrot", "celery", "cabbage", "onion"];
        var text = "";
        var i;
        for (i = 0; i < veg.length; i++) {
            text += veg[i] + "<br>";
        }

        document.getElementById("demo").innerHTML = text;


    </script>

    <h2>Switch in JS</h2>

    <p id="demo2"></p>

    <script>

        var month;
        switch (new Date().getMonth()) {
            case 0:
                month = "janurary";
                break;
            case 1:
                month = "feburary";
                break;
            case 2:
                month = "march";
                break;
            case 3:
                month = "april";
                break;
            case 4:
                month = "May";
                break;
            case 5:
                month = "june";
                break;
            case 6:
                month = "july";
                break;
            case 7:
                month = "august";
                break;
            case 8:
                month = "september";
                break;
            case 9:
                month = "october";
                break;
            case 10:
                month = "november";
                break;
            case 11:
                month = "december";


        }

        document.getElementById("demo2").innerHTML = "The month is " + month;

    </script>

</body>
