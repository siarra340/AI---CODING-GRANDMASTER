<!DOCTYPE html>
<html>

<head>
    <title>Backgrounds in CSS</title>

    <style>
        h1 {
            background-image: url(images.png);
            height: 150px;
            width: 500px;
            background-position: bottom right;
            background-repeat: space;
            background-attachment: scroll;
        }

        p {
            background-color: pink
        }

        #grad1 {
            font-size: 30px;
            height: 300px;
            width: 200px;
            background: linear-gradient(to left, pink, yellow, orange)
        }

        #grad2 {
            font-size: 25px;
            color: rgb(207, 137, 25);
            height: 200px;
            background: radial-gradient(rgb(117, 117, 228) 5%, rgb(198, 86, 198) 20%, rgb(255, 255, 154) 70%)
        }

        @keyframe hello {
            0% {
                background-color: green;
            }

            25% {
                background-color: purple;
            }

            50% {
                background-color: blue;
            }

            100% {
                background-color: orange;
            }
        }

        #element {
            width: 200px;
            height: 150px;
            background-color: rgb(231, 130, 130);
            animation-name: hello;
            animation-duration: 5s;
        }
    </style>
</head>

<body>
    <h1>Hello World</h1>
    <p>This is how to change the background color</p>
    <i id="grad1">Hello World</i>
    <br><br>
    <div id="grad2">This is a radial gradient</div>

    <br>
    <div id="element">Hello</div>
</body>

</html>
