<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">


    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">


    <title>Hobbie Containers</title>

</head>

<body>

    <h1>Hobbies sections</h1>

    <div class="container bg-primary text-white p-3 mb-6">
        <h1>Art</h1>
        <p>Art is a hobby where you can do different things like paint and draw.</p>
    </div>

    <div class="container-fluid border border-dark p-3 my-4">
        <h1>Reading</h1>
        <p>Reading is a hobby where you read and enjoy books.</p>
    </div>

    <div class="container bg-danger p-3 my-4 text-white">
        <h1>Cycling</h1>
        <p>Cycling is a hobby where you ride a bike</p>
    </div>

    <div class="container-fluid bg-success text-white border border-light p-3 my-4">
        <h1>Writing</h1>
        <p>Writing is a hobby where you write about different thing.</p>
    </div>

</body>

</html>
