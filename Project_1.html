<!DOCTYPE html>
<html>

<body>

    <h2>Arrays in JS</h2>
    <p id="demo"></p>

    <script>

        var animals = ["Cat", "dog", "Rat"];
        document.getElementById("demo").innerHTML = "One animal that can be kept as home pets is a  " + animals[1]
    </script>

    <hr style="color:brown; border-top: 3px dotted;">

    <h2>Methods in Arrays</h2>
    <p id="join"></p>
    <p id="pop1"></p>
    <p id="pop2"></p>

    <script>
        var cars = ["Toyota", "Ford", "Honda", "BMW"];
        document.getElementById("join").innerHTML = cars.join("=>")
        document.getElementById("pop1").innerHTML = cars;
        cars.pop()
        document.getElementById("pop2").innerHTML = cars;
    </script>

    <hr style="color:brown; border-top: 3px soild ;">
    <h2>Call Stack in JS</h2>
    <p>Do a calculation and return it:</p>
    <p id="demo2"></p>

    <script>
        function divide(a, b) {
            return a / b
        }

        function percentage(a, b) {
            return divide(a, b) * 100
        }

        let result = percentage(2, 10)
        document.getElementById("demo2").innerHTML = "The percentage of 2/10 equals to " + result + "%"
    </script>




</html>
