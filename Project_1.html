<!DOCTYPE html>
<html>

<head>

    <title>My Super Hero Power Cards </title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f4ff;
            text-align: center;
            padding: 30px;

        }

        h1 {
            color: #ff4d4d
        }

        p {
            color: #444444;
        }

        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .hero-card {
            background-color: white;
            border: 3px solid #ff4d4d;
            border-radius: 12px;
            width: 220px;
            padding: 18px;
        }

        .hero-name {
            font-size: 22px;
            font-weight: bold;
            color: #222222;
        }

        .hero-power {
            color: #0057b8;
            font-weight: bold;
        }

        .hero-mission {
            color: #666666;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <h1>My Superhero Power Cards</h1>

    <p>Click the button to create superhero objects using JavaScript classes.</p>

    <button onclick="showHeroes()">Show Superheroes</button>

    <div class="card-container" id="heroCards">

    </div>

    <script src="script.js"></script>



</body>


</html>
