<!DOCTYPE html>

<html lang="en">

<head>

    <title>Bootstrap Jumbotron</title>


    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">


    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>

</head>

<body style="text-align:center;">

    <div class="jumbotron jumbotron-fluid">

        <div class="container">

            <h1 style="color:rgb(217, 222, 76)">Codingal</h1>

            <p>Condingal is a platform where you can learn and develop your coding.</p>

        </div>
    </div>

    <div class="container border my-4">
        <h2 style="color:orange">Webpage Sections</h2>
        <button type="button" class="btn btn-danger">Home</button>
        <button type="button" class="btn btn-primary">Settings</button>
        <button type="button" class="btn btn-success">Contacts</button>
    </div>
    </div>

    <div class="container bg-dark p-2">

        <span class="badge badge-primary">Notification</span>
        <span class="badge badge-light">Info</span>
        <span class="badge badge-danger">Danger</span>
    </div>

    <div class="container my-4">
        <h1>Progress</h1>
        <div class="progress">
            <div class="progress-bar" style="width:60%">60%</div>
        </div>
    </div>

</body>



</html>
