<!DOCTYPE html>
<html>

<head>

    <title>My Zoo </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff2b4;
            text-align: center;
            padding: 30px;


        }

        h1 {
            color: #d0ce5f;
            -webkit-text-stroke: 1px rgb(0, 0, 0);
        }

        #zoo {
            border: 2px soild #ff5a43;
            width: 300px;
            margin: 16px auto;
            padding: 12px;
            border-radius: 10px;
            background: white;
        }

        .zone {
            border: 1px solid #ff5a43;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: left;

        }

        button {
            background: #ff5a43;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
        }
    </style>

</head>


<body>

    <h1>My Zoo</h1>
    <p>Use JavaScript and DOM to add animals to each cage! </p>

    <div id="zoo">

        <div class="zone">Zone 1: <span id="zone1">Empty</span></div>
        <div class="zone">Zone 2: <span id="zone2">Empty</span></div>
        <div class="zone"> Zone 3: <span id="zone3">Empty</span></div>
        <div class="zone"> Total Animals: <span id="total">0</span></div>

    </div>

    <br>

    <button onclick="openZoo()">Open the Zoo!</button>

    <p id="zoo-status"></p>

    <script>

        function openZoo() {
            document.getElementById("zone1").innerHTML = "Lion";
            document.getElementById("zone2").innerHTML = "Penguin";
            document.getElementById("zone3").innerHTML = "Tiger";

            document.getElementById("total").innerHTML = "3";

            document.getElementById("zoo").style.backgroundColor = "lightgreen";

            document.getElementById("zoo-status").innerHTML = document.title + " is now open!"




        }
    </script>


</body>


</html>
